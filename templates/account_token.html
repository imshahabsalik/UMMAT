<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Verify email' if mode == 'verify' else 'Choose a new password' }} — UMMAT</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/extra.css"></head>
<body><header class="nav"><a class="brand" href="/">UMMAT</a><a class="outline" href="/login">Log in</a></header><main class="form-page wide"><div class="form-intro"><span class="eyebrow">SUPPLIER ACCOUNT</span><h1>{{ 'Verify your email' if mode == 'verify' else 'Choose a new password' }}</h1></div>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
{% if mode == 'verify' %}<form class="store-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><button class="primary full" type="submit">Verify email address</button></form>{% else %}<form class="store-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label>New password<input type="password" name="password" required minlength="12" maxlength="128" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm_password" required minlength="12" maxlength="128" autocomplete="new-password"></label><button class="primary full" type="submit">Save new password</button></form>{% endif %}</main></body></html>
