<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Verify email' if mode == 'verify' else 'Reset password' }} — UMMAT</title><link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/extra.css"></head>
<body><header class="nav"><a class="brand" href="/">UMMAT</a><a class="outline" href="/login">Log in</a></header><main class="form-page wide"><div class="form-intro"><span class="eyebrow">SUPPLIER ACCOUNT</span><h1>{{ 'Resend verification' if mode == 'verify' else 'Forgot your password?' }}</h1><p>Enter the email address associated with your supplier account.</p></div>
<form class="store-form" method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">{% if message %}<div class="alert">{{ message }}</div>{% endif %}<label>Email address<input type="email" name="email" required maxlength="254" autocomplete="email"></label><button class="primary full" type="submit">{{ 'Send verification link' if mode == 'verify' else 'Send reset link' }}</button></form></main></body></html>
