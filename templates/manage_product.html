<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ 'Edit' if editing else 'Add' }} Product — UMMAT</title>
  <link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/extra.css">
</head>
<body>
<header class="nav"><a class="brand" href="/">UMMAT</a><a class="outline" href="/dashboard">Dashboard</a></header>
<main class="form-page wide">
  <div class="form-intro"><span class="eyebrow">{{ store.business_name }}</span><h1>{{ 'Edit product' if editing else 'Add a product' }}</h1><p>Product details appear on your public store.</p></div>
  <form class="store-form" method="post" enctype="multipart/form-data">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    {% for error in errors %}<div class="alert error" role="alert">{{ error }}</div>{% endfor %}
    <label>Product name <em>*</em><input name="product_name" value="{{ request.form.get('product_name', product.get('name', '')) }}" maxlength="160" required></label>
    <div class="two-col">
      <label>Price (₹) <small>Leave blank to show “Contact for price”{% if product.get('price') is string %}; current text price: {{ product.get('price') }}{% endif %}</small><input name="product_price" value="{{ request.form.get('product_price', product.get('price') if product.get('price') is number else '') }}" inputmode="decimal" maxlength="20"></label>
      <label>Price is per <select name="product_unit">{% for u in UNITS %}<option value="{{ u }}" {{ 'selected' if request.form.get('product_unit', product.get('unit', 'piece')) == u }}>{{ u }}</option>{% endfor %}</select></label>
    </div>
    <label>Minimum order quantity <em>*</em><input name="product_moq" value="{{ request.form.get('product_moq', product.get('moq', '')) }}" inputmode="numeric" maxlength="10" required></label>
    <label>Description <small>Optional</small><textarea name="product_description" rows="3" maxlength="1000">{{ request.form.get('product_description', product.get('description', '')) }}</textarea></label>
    {% if product.get('image') %}<p class="muted">Current photo:</p><img class="manage-photo" src="{{ url_for('static', filename=product.image) }}" alt="Current product photo">{% endif %}
    <label>Product photo <small>Optional · JPG, PNG or WebP · max 5 MB{% if editing %}; leave empty to keep the current photo{% endif %}</small><input type="file" name="product_image" accept="image/jpeg,image/png,image/webp"></label>
    <button class="primary full" type="submit">{{ 'Save product' if editing else 'Add product' }}</button>
  </form>
</main>
</body></html>
